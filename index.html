<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RDO - Relatório Diário de Obra</title>
  <style>
    :root {
      --primary: #1e293b;
      --accent: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 650px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid #e2e8f0;
      overflow: hidden;
    }

    .card-header {
      background-color: var(--primary);
      color: #ffffff;
      padding: 20px 24px;
    }

    .card-header h2 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .card-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-title {
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 500px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
    }

    .estaca-box {
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: #fff;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .estaca-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .estaca-box input {
      border: none;
      outline: none;
      padding: 10px 12px;
      width: 100%;
      font-size: 0.95rem;
      color: var(--text);
    }

    .estaca-box span {
      font-weight: bold;
      color: var(--text-muted);
      padding: 0 8px;
      user-select: none;
      background-color: #f1f5f9;
      height: 100%;
      display: flex;
      align-items: center;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    .result-box {
      background-color: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      width: 100%;
      outline: none;
    }

    /* Remove as setinhas dos inputs numéricos */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <h2>Relatório Diário de Obra (RDO)</h2>
  </div>

  <div class="card-body">
    <div class="section-title">Estaqueamento do Trecho</div>

    <div class="grid-2">
      <!-- Estaca Inicial -->
      <div class="field-group">
        <label>Estaca Inicial</label>
        <div class="estaca-box">
          <input type="number" id="est_ini" placeholder="Estaca" oninput="calcularMetragem()">
          <span>+</span>
          <input type="number" step="0.01" id="mais_ini" placeholder="Metros" oninput="calcularMetragem()">
        </div>
      </div>

      <!-- Estaca Final -->
      <div class="field-group">
        <label>Estaca Final</label>
        <div class="estaca-box">
          <input type="number" id="est_fim" placeholder="Estaca" oninput="calcularMetragem()">
          <span>+</span>
          <input type="number" step="0.01" id="mais_fim" placeholder="Metros" oninput="calcularMetragem()">
        </div>
      </div>
    </div>

    <!-- Extensão Total -->
    <div class="field-group">
      <label for="metragem_total">Extensão Calculada</label>
      <input type="text" id="metragem_total" class="result-box" readonly placeholder="0,00 m">
    </div>
  </div>
</div>

<script>
  function calcularMetragem() {
    const estIniVal = document.getElementById('est_ini').value;
    const maisIniVal = document.getElementById('mais_ini').value;
    const estFimVal = document.getElementById('est_fim').value;
    const maisFimVal = document.getElementById('mais_fim').value;

    const eIni = estIniVal !== '' ? parseFloat(estIniVal) : 0;
    const mIni = maisIniVal !== '' ? parseFloat(maisIniVal) : 0;
    const eFim = estFimVal !== '' ? parseFloat(estFimVal) : 0;
    const mFim = maisFimVal !== '' ? parseFloat(maisFimVal) : 0;

    const temIni = (estIniVal !== '') || (maisIniVal !== '');
    const temFim = (estFimVal !== '') || (maisFimVal !== '');

    if (temIni && temFim) {
      const mInicial = (eIni * 20) + mIni;
      const mFinal = (eFim * 20) + mFim;
      const total = Math.abs(mFinal - mInicial);

      const totalFormatado = total.toLocaleString('pt-BR', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + ' m';

      document.getElementById('metragem_total').value = totalFormatado;
    } else {
      document.getElementById('metragem_total').value = '';
    }
  }
</script>

</body>
</html>
