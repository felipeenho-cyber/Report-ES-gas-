<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RDO - Relatório Diário de Obra</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f6f8;
      color: #333;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border: 1px solid #ccc;
    }
    h1, h2, h3 {
      color: #1a365d;
      margin-top: 0;
    }
    .header-title {
      text-align: center;
      border-bottom: 2px solid #1a365d;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    .section-box {
      border: 1px solid #dcdcdc;
      background: #fafafa;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 16px;
      font-weight: bold;
      color: #1a365d;
      margin-bottom: 12px;
      border-bottom: 1px solid #e2e2e2;
      padding-bottom: 5px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 15px;
    }
    .field-group {
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 5px;
      color: #444;
    }
    input[type="text"], input[type="number"], input[type="date"], select {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .estaca-input-container {
      display: flex;
      align-items: center;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      padding: 0 5px;
    }
    .estaca-input-container input {
      border: none;
      outline: none;
      padding: 8px;
      width: 100%;
      font-size: 14px;
    }
    .estaca-input-container span {
      font-weight: bold;
      color: #555;
      padding: 0 6px;
    }
    input[readonly] {
      background-color: #e9ecef;
      font-weight: bold;
      color: #1a365d;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-title">
    <h1>RELATÓRIO DIÁRIO DE OBRA (RDO)</h1>
  </div>

  <!-- SEÇÃO 1: CABEÇALHO DA OBRA -->
  <div class="section-box">
    <div class="section-title">Informações Gerais da Obra</div>
    <div class="grid-3">
      <div class="field-group">
        <label for="data_rdo">Data:</label>
        <input type="date" id="data_rdo">
      </div>
      <div class="field-group">
        <label for="contrato">Contrato / Obra:</label>
        <input type="text" id="contrato" placeholder="Ex: Rede SIMEC">
      </div>
      <div class="field-group">
        <label for="clima">Clima / Tempo:</label>
        <select id="clima">
          <option value="bom">Bom / Ensolarado</option>
          <option value="nublado">Nublado</option>
          <option value="chuvoso">Chuvoso</option>
          <option value="impraticavel">Impraticável</option>
        </select>
      </div>
    </div>
  </div>

  <!-- SEÇÃO 2: EQUIPE TÉCNICA E RESPONSÁVEIS -->
  <div class="section-box">
    <div class="section-title">Equipe Técnica e Responsáveis</div>
    <div class="grid">
      <div class="field-group">
        <label for="eng_responsavel">Engenheiro Responsável:</label>
        <input type="text" id="eng_responsavel" placeholder="Nome do Engenheiro">
      </div>
      <div class="field-group">
        <label for="eng_fiscal">Engenheiro Fiscal / Cliente:</label>
        <input type="text" id="eng_fiscal" placeholder="Nome do Engenheiro Fiscal">
      </div>
      <div class="field-group">
        <label for="tec_responsavel">Técnico de Campo / Qualidade:</label>
        <input type="text" id="tec_responsavel" placeholder="Nome do Técnico">
      </div>
      <div class="field-group">
        <label for="encarregado">Encarregado da Obra:</label>
        <input type="text" id="encarregado" placeholder="Nome do Encarregado">
      </div>
    </div>
  </div>

  <!-- SEÇÃO 3: ESTAQUEAMENTO E TRECHO -->
  <div class="section-box">
    <div class="section-title">Estaqueamento e Extensão do Trecho</div>
    <div class="grid">
      <!-- Estaca Inicial -->
      <div class="field-group">
        <label>Estaca Inicial:</label>
        <div class="estaca-input-container">
          <input type="number" id="est_ini" placeholder="Estaca" oninput="calcularMetragem()">
          <span>+</span>
          <input type="number" step="0.01" id="mais_ini" placeholder="Metros" oninput="calcularMetragem()">
        </div>
      </div>

      <!-- Estaca Final -->
      <div class="field-group">
        <label>Estaca Final:</label>
        <div class="estaca-input-container">
          <input type="number" id="est_fim" placeholder="Estaca" oninput="calcularMetragem()">
          <span>+</span>
          <input type="number" step="0.01" id="mais_fim" placeholder="Metros" oninput="calcularMetragem()">
        </div>
      </div>
    </div>

    <div class="field-group" style="margin-top: 15px;">
      <label for="metragem_total">Extensão Total Calculada:</label>
      <input type="text" id="metragem_total" readonly placeholder="0,00 m">
    </div>
  </div>
</div>

<script>
  function calcularMetragem() {
    const estIniVal = document.getElementById('est_ini').value;
    const maisIniVal = document.getElementById('mais_ini').value;
    const estFimVal = document.getElementById('est_fim').value;
    const maisFimVal = document.getElementById('mais_fim').value;

    const eIni = estIniVal !== '' ? parseFloat(estIniVal) : 0;
    const mIni = maisIniVal !== '' ? parseFloat(maisIniVal) : 0;
    const eFim = estFimVal !== '' ? parseFloat(estFimVal) : 0;
    const mFim = maisFimVal !== '' ? parseFloat(maisFimVal) : 0;

    const temIni = (estIniVal !== '') || (maisIniVal !== '');
    const temFim = (estFimVal !== '') || (maisFimVal !== '');

    if (temIni && temFim) {
      // 1 Estaca = 20 metros
      const mInicial = (eIni * 20) + mIni;
      const mFinal = (eFim * 20) + mFim;
      const total = Math.abs(mFinal - mInicial);

      const totalFormatado = total.toLocaleString('pt-BR', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + ' m';

      document.getElementById('metragem_total').value = totalFormatado;
    } else {
      document.getElementById('metragem_total').value = '';
    }
  }
</script>

</body>
</html>
