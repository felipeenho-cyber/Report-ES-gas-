<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDO - Sistema de Salvamento Direto</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #f1f5f9; padding: 20px; color: #334155; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        h1 { font-size: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; font-size: 12px; margin-bottom: 5px; }
        input, textarea, select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 14px; }
        .btn { background-color: #f59e0b; color: white; border: none; padding: 12px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .btn:hover { background-color: #d97706; }
        .btn-tab { background-color: #64748b; margin-right: 5px; padding: 6px 12px; font-size: 12px; }
        .card { border: 1px solid #e2e8f0; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div style="margin-bottom: 20px;">
        <button type="button" class="btn btn-tab" onclick="abrirAba('formAba')">Formulário</button>
        <button type="button" class="btn btn-tab" onclick="abrirAba('historicoAba')">Histórico (<span id="countHist">0</span>)</button>
    </div>

    <!-- ABA FORMULÁRIO -->
    <div id="formAba">
        <h1>Preenchimento do RDO</h1>
        
        <div class="form-group">
            <label>Obra / Empreendimento *</label>
            <input type="text" id="campoObra" placeholder="Ex: Rede de Gás">
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
                <label>Nº do RDO *</label>
                <input type="text" id="campoNumero" placeholder="001">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Data *</label>
                <input type="date" id="campoData">
            </div>
        </div>

        <div class="form-group">
            <label>Equipe / Colaboradores</label>
            <textarea id="campoEquipe" rows="3"></textarea>
        </div>

        <div class="form-group">
            <label>Observações Gerais / Atividades</label>
            <textarea id="campoObs" rows="4"></textarea>
        </div>

        <button type="button" class="btn" onclick="salvarRDO()">SALVAR AGORA</button>
    </div>

    <!-- ABA HISTÓRICO -->
    <div id="historicoAba" class="hidden">
        <h1>Histórico de Relatórios</h1>
        <div id="listaHistorico">Nenhum RDO salvo ainda.</div>
    </div>
</div>

<script>
    // Inicialização ao carregar a página
    window.onload = function() {
        document.getElementById('campoData').value = new Date().toISOString().split('T')[0];
        atualizarLista();
    };

    function abrirAba(nomeAba) {
        document.getElementById('formAba').classList.add('hidden');
        document.getElementById('historicoAba').classList.add('hidden');
        document.getElementById(nomeAba).classList.remove('hidden');
        if(nomeAba === 'historicoAba') atualizarLista();
    }

    function salvarRDO() {
        try {
            var obra = document.getElementById('campoObra').value;
            var numero = document.getElementById('campoNumero').value;
            var data = document.getElementById('campoData').value;

            if (!obra || !numero || !data) {
                alert('PREENCHA OS CAMPOS OBRIGATÓRIOS: Obra, Nº do RDO e Data!');
                return;
            }

            var novoRDO = {
                id: 'rdo_' + Date.now(),
                obra: obra,
                numero: numero,
                data: data,
                equipe: document.getElementById('campoEquipe').value,
                obs: document.getElementById('campoObs').value
            };

            // Busca histórico antigo
            var historico = JSON.parse(localStorage.getItem('rdo_dados_simples') || '[]');
            
            // Adiciona o novo no começo
            historico.unshift(novoRDO);

            // Grava no LocalStorage
            localStorage.setItem('rdo_dados_simples', JSON.stringify(historico));

            alert('SALVO COM SUCESSO!');
            
            // Limpa o formulário
            document.getElementById('campoObra').value = '';
            document.getElementById('campoNumero').value = '';
            document.getElementById('campoEquipe').value = '';
            document.getElementById('campoObs').value = '';
            
            atualizarLista();
            abrirAba('historicoAba');

        } catch (erro) {
            alert('ERRO AO SALVAR: Seu navegador pode estar bloqueando o armazenamento local (ex: Modo Anônimo ou Cookies Bloqueados).\n\nDetalhe do erro: ' + erro.message);
        }
    }

    function atualizarLista() {
        var historico = JSON.parse(localStorage.getItem('rdo_dados_simples') || '[]');
        document.getElementById('countHist').innerText = historico.length;
        
        var container = document.getElementById('listaHistorico');
        
        if (historico.length === 0) {
            container.innerHTML = '<p>Nenhum registro encontrado no navegador.</p>';
            return;
        }

        var html = '';
        for (var i = 0; i < historico.length; i++) {
            var item = historico[i];
            html += '<div class="card">' +
                '<strong>RDO Nº ' + item.numero + '</strong> - ' + item.data + '<br>' +
                '<span>Obra: ' + item.obra + '</span><br>' +
                '<small>' + (item.obs || 'Sem observações') + '</small>' +
                '</div>';
        }
        container.innerHTML = html;
    }
</script>

</body>
</html>
