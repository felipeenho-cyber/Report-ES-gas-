<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produção PEAD</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

  <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-sm border border-gray-200">
    <div class="flex items-center gap-2 mb-4 border-b pb-3">
      <span class="text-blue-600 font-bold text-lg">📊 PRODUÇÃO / ASSENTAMENTO PEAD (1 ESTACA = 20M)</span>
    </div>

    <!-- Container PEAD 63 mm -->
    <div class="border rounded-xl p-5 bg-slate-50 border-gray-200">
      <div class="flex items-center mb-4">
        <input type="checkbox" id="pead63_check" checked class="w-4 h-4 text-blue-600 rounded">
        <label for="pead63_check" class="ml-2 font-bold text-gray-800">PEAD 63 mm</label>
      </div>

      <!-- Lista Dinâmica de Trechos -->
      <div id="trechos-container" class="space-y-3">
        <!-- O JS insere as linhas aqui -->
      </div>

      <!-- Botão Adicionar -->
      <button onclick="adicionarTrecho()" class="mt-4 flex items-center gap-1 bg-blue-50 text-blue-600 border border-blue-200 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-blue-100 transition">
        <span>+</span> Adicionar Trecho
      </button>

      <!-- Total Acumulado -->
      <div class="mt-5 border-t pt-4">
        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide">Total Metragem (Calculado)</label>
        <input type="text" id="total-metragem" value="0,00" readonly class="w-full mt-1 p-2 bg-slate-200 border border-slate-300 rounded-md font-bold text-slate-700 text-lg">
      </div>
    </div>
  </div>

  <script>
    let contadorTrechos = 0;

    // Adiciona o primeiro trecho ao carregar
    window.onload = () => adicionarTrecho();

    function adicionarTrecho() {
      contadorTrechos++;
      const container = document.getElementById('trechos-container');
      
      const divTrecho = document.createElement('div');
      divTrecho.id = `trecho-${contadorTrechos}`;
      divTrecho.className = 'flex flex-wrap md:flex-nowrap items-end gap-3 bg-white p-3 rounded-lg border border-gray-200 shadow-sm relative';
      
      divTrecho.innerHTML = `
        <div class="flex-1">
          <label class="block text-xs font-semibold text-gray-600">Estaca Início (X)</label>
          <div class="flex gap-1 mt-1">
            <input type="number" placeholder="Estaca" class="estaca-inicio w-1/2 p-2 border rounded-md text-sm" oninput="calcularTotal()">
            <input type="number" step="0.01" placeholder="Metros" class="metro-inicio w-1/2 p-2 border rounded-md text-sm" oninput="calcularTotal()">
          </div>
        </div>

        <div class="flex-1">
          <label class="block text-xs font-semibold text-gray-600">Estaca Final (Y)</label>
          <div class="flex gap-1 mt-1">
            <input type="number" placeholder="Estaca" class="estaca-final w-1/2 p-2 border rounded-md text-sm" oninput="calcularTotal()">
            <input type="number" step="0.01" placeholder="Metros" class="metro-final w-1/2 p-2 border rounded-md text-sm" oninput="calcularTotal()">
          </div>
        </div>

        <div class="w-32">
          <label class="block text-xs font-semibold text-gray-500">Subtotal (m)</label>
          <input type="text" readonly class="subtotal w-full mt-1 p-2 bg-gray-100 border rounded-md text-sm font-semibold text-gray-700" value="0.00">
        </div>

        <button onclick="removerTrecho('trecho-${contadorTrechos}')" class="p-2 text-red-500 hover:bg-red-50 rounded-md" title="Remover trecho">
          🗑️
        </button>
      `;

      container.appendChild(divTrecho);
    }

    function removerTrecho(id) {
      const el = document.getElementById(id);
      if (document.querySelectorAll('#trechos-container > div').length > 1) {
        el.remove();
        calcularTotal();
      } else {
        alert("O formulário precisa ter ao menos um trecho.");
      }
    }

    function calcularTotal() {
      let totalGeral = 0;
      const trechos = document.querySelectorAll('#trechos-container > div');

      trechos.forEach(trecho => {
        const estacaInicio = parseFloat(trecho.querySelector('.estaca-inicio').value) || 0;
        const metroInicio = parseFloat(trecho.querySelector('.metro-inicio').value) || 0;
        const estacaFinal = parseFloat(trecho.querySelector('.estaca-final').value) || 0;
        const metroFinal = parseFloat(trecho.querySelector('.metro-final').value) || 0;

        // Fórmula: (Estaca * 20 + Metros)
        const posicaoInicial = (estacaInicio * 20) + metroInicio;
        const posicaoFinal = (estacaFinal * 20) + metroFinal;

        let subtotal = posicaoFinal - posicaoInicial;
        if (subtotal < 0) subtotal = 0; // Evita metragem negativa se digitado invertido

        trecho.querySelector('.subtotal').value = subtotal.toFixed(2).replace('.', ',');
        totalGeral += subtotal;
      });

      document.getElementById('total-metragem').value = totalGeral.toFixed(2).replace('.', ',');
    }
  </script>
</body>
</html>
