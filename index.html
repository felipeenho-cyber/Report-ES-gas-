<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Reporte Diário</title>
    <!-- Bibliotecas externas para envio de e-mail sem servidor (EmailJS) -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root {
            --primary: #0056b3;
            --success: #28a745;
            --danger: #dc3545;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 15px;
            color: #333;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9em;
            color: #666;
            margin-bottom: 20px;
        }

        /* Sistema de Abas */
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: #e0e0e0;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85em;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        /* Cards e Formulário */
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 0.95em;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        /* Botões Início e Término */
        .jornada-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .jornada-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #ccc;
            background: #f8f9fa;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .jornada-btn.active-inicio {
            background: #e3f2fd;
            border-color: #2196f3;
            color: #0d47a1;
        }

        .jornada-btn.active-termino {
            background: #fbe9e7;
            border-color: #ff5722;
            color: #bf360c;
        }

        /* Botões do Sistema */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .btn-success { background: var(--success); color: white; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-danger { background: var(--danger); color: white; font-size: 0.8em; width: auto; padding: 4px 8px; margin: 0; }

        .hidden { display: none; }

        /* Estilo da Tabela do Histórico */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.85em;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th { background-color: #f2f2f2; }

        /* Configuração de Impressão (Exportar PDF) */
        @media print {
            body * { visibility: hidden; }
            #historico-section, #historico-section * { visibility: visible; }
            #historico-section { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📋 REPORTE DIÁRIO DE OBRAS</h2>
    <div class="subtitle">Gerenciamento e Controle de Jornada</div>

    <!-- NAVEGAÇÃO DE ABAS -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('gerador', event)">📝 Gerador</button>
        <button class="tab-btn" onclick="switchTab('projetos', event)">🏗️ Projetos e Setores</button>
        <button class="tab-btn" onclick="switchTab('historico', event)">🗂️ Histórico</button>
    </div>

    <!-- ABA 1: GERADOR DE REPORTE -->
    <div id="gerador-section" class="card">
        <div class="jornada-toggle">
            <div id="btn-inicio" class="jornada-btn active-inicio" onclick="setJornada('INÍCIO DE JORNADA')">🌅 INÍCIO DE JORNADA</div>
            <div id="btn-termino" class="jornada-btn" onclick="setJornada('TÉRMINO DE JORNADA')">🌌 TÉRMINO DE JORNADA</div>
        </div>

        <form id="reporteForm" onsubmit="salvarEReportar(event)">
            <div class="form-group">
                <label>Projeto / Obra *</label>
                <select id="select-projeto" required onchange="carregarSetores()">
                    <option value="">Selecione um projeto...</option>
                </select>
            </div>

            <div class="form-group">
                <label>Setorização *</label>
                <select id="select-setor" required>
                    <option value="">Selecione primeiro o projeto...</option>
                </select>
            </div>

            <div class="form-group">
                <label>Responsável / Encarregado *</label>
                <input type="text" id="responsavel" placeholder="Digite seu nome completo" required>
            </div>

            <div class="form-group">
                <label>E-mail para Notificação *</label>
                <input type="email" id="email-destino" placeholder="exemplo@suaempresa.com" required>
            </div>

            <div class="form-group">
                <label>Observações / Atividades Realizadas</label>
                <textarea id="observacoes" placeholder="Descreva o andamento da obra, equipes, intercorrências ou observações gerais..."></textarea>
            </div>

            <button type="submit" class="btn btn-success">💾 Salvar e Enviar E-mail</button>
        </form>
    </div>

    <!-- ABA 2: CADASTRO DINÂMICO DE PROJETOS E SETORES -->
    <div id="projetos-section" class="card hidden">
        <h3>Cadastrar Projeto e Setores</h3>
        <form onsubmit="cadastrarProjetoSetor(event)">
            <div class="form-group">
                <label>Nome do Projeto / Obra *</label>
                <input type="text" id="novo-projeto" placeholder="Ex: Obra Renovação PE - Fase 2" required>
            </div>
            <div class="form-group">
                <label>Setores (Separados por vírgula) *</label>
                <input type="text" id="novos-setores" placeholder="Ex: Frente A, Módulo Tubulação, Subestação" required>
            </div>
            <button type="submit" class="btn btn-primary">➕ Salvar Projeto</button>
        </form>

        <hr style="margin: 20px 0;">

        <h4>Projetos Cadastrados</h4>
        <div id="lista-projetos"></div>
    </div>

    <!-- ABA 3: HISTÓRICO E RELATÓRIOS (EXCEL E PDF) -->
    <div id="historico-section" class="card hidden">
        <h3>Histórico de Reportes</h3>
        
        <div class="no-print" style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button class="btn btn-primary" onclick="exportarExcel()">📊 Exportar Excel (.CSV)</button>
            <button class="btn btn-secondary" onclick="exportarPDF()">📄 Exportar PDF</button>
        </div>

        <div style="overflow-x:auto;">
            <table id="tabela-historico">
                <thead>
                    <tr>
                        <th>Data/Hora</th>
                        <th>Jornada</th>
                        <th>Projeto</th>
                        <th>Setor</th>
                        <th>Responsável</th>
                        <th>Obs.</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela">
                    <!-- Preenchido dinamicamente -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // --- LÓGICA DO SISTEMA --- //

    let tipoJornadaAtual = 'INÍCIO DE JORNADA';

    // Banco de Dados Local (Armazenado no próprio navegador)
    let projetosBD = JSON.parse(localStorage.getItem('projetos_db')) || [
        { projeto: "Projeto Exemplo A", setores: ["Frente 1 - Tubulação", "Frente 2 - Aço"] }
    ];
    let reportesBD = JSON.parse(localStorage.getItem('reportes_db')) || [];

    // Inicialização do EmailJS
    (function(){
        // INSIRA AQUI SUA CHAVE PÚBLICA DO EMAILJS SE FOR USAR ENVIO REAL
        emailjs.init("SUA_PUBLIC_KEY_AQUI"); 
    })();

    // Função de Alternar entre Abas
    function switchTab(tab, event) {
        document.getElementById('gerador-section').classList.add('hidden');
        document.getElementById('projetos-section').classList.add('hidden');
        document.getElementById('historico-section').classList.add('hidden');

        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

        if (tab === 'gerador') {
            document.getElementById('gerador-section').classList.remove('hidden');
            renderizarSelectProjetos();
        } else if (tab === 'projetos') {
            document.getElementById('projetos-section').classList.remove('hidden');
            renderizarListaProjetos();
        } else if (tab === 'historico') {
            document.getElementById('historico-section').classList.remove('hidden');
            renderizarHistorico();
        }
        
        if (event) event.target.classList.add('active');
    }

    // Alternar Tipo de Jornada
    function setJornada(tipo) {
        tipoJornadaAtual = tipo;
        const btnInicio = document.getElementById('btn-inicio');
        const btnTermino = document.getElementById('btn-termino');

        if (tipo === 'INÍCIO DE JORNADA') {
            btnInicio.className = 'jornada-btn active-inicio';
            btnTermino.className = 'jornada-btn';
        } else {
            btnInicio.className = 'jornada-btn';
            btnTermino.className = 'jornada-btn active-termino';
        }
    }

    // Carregar Projetos no Select do Gerador
    function renderizarSelectProjetos() {
        const select = document.getElementById('select-projeto');
        select.innerHTML = '<option value="">Selecione um projeto...</option>';
        projetosBD.forEach((item, index) => {
            select.innerHTML += `<option value="${index}">${item.projeto}</option>`;
        });
    }

    // Carregar Setores com base no Projeto Selecionado
    function carregarSetores() {
        const projIdx = document.getElementById('select-projeto').value;
        const selectSetores = document.getElementById('select-setor');
        selectSetores.innerHTML = '<option value="">Selecione o setor...</option>';

        if (projIdx !== "") {
            projetosBD[projIdx].setores.forEach(setor => {
                selectSetores.innerHTML += `<option value="${setor}">${setor}</option>`;
            });
        }
    }

    // Cadastrar Novo Projeto e seus Setores
    function cadastrarProjetoSetor(e) {
        e.preventDefault();
        const nomeProj = document.getElementById('novo-projeto').value.trim();
        const setoresStr = document.getElementById('novos-setores').value;
        const listaSetores = setoresStr.split(',').map(s => s.trim()).filter(s => s !== "");

        projetosBD.push({ projeto: nomeProj, setores: listaSetores });
        localStorage.setItem('projetos_db', JSON.stringify(projetosBD));

        alert("Projeto cadastrado com sucesso!");
        document.getElementById('novo-projeto').value = '';
        document.getElementById('novos-setores').value = '';
        renderizarListaProjetos();
    }

    // Excluir Projeto Cadastrado
    function excluirProjeto(index) {
        if(confirm("Deseja realmente remover este projeto?")) {
            projetosBD.splice(index, 1);
            localStorage.setItem('projetos_db', JSON.stringify(projetosBD));
            renderizarListaProjetos();
        }
    }

    // Renderizar Projetos Cadastrados
    function renderizarListaProjetos() {
        const container = document.getElementById('lista-projetos');
        container.innerHTML = '';
        projetosBD.forEach((item, index) => {
            container.innerHTML += `
                <div style="background:#f8f9fa; padding:10px; border-radius:5px; margin-bottom:8px; border-left:4px solid var(--primary); display:flex; justify-between; align-items:center;">
                    <div>
                        <strong>${item.projeto}</strong><br>
                        <small><b>Setores:</b> ${item.setores.join(', ')}</small>
                    </div>
                    <div>
                        <button class="btn btn-danger" onclick="excluirProjeto(${index})">🗑️ Excluir</button>
                    </div>
                </div>`;
        });
    }

    // Salvar o Reporte e Disparar E-mail
    function salvarEReportar(e) {
        e.preventDefault();
        const projIdx = document.getElementById('select-projeto').value;
        const projetoNome = projetosBD[projIdx].projeto;
        const setor = document.getElementById('select-setor').value;
        const responsavel = document.getElementById('responsavel').value;
        const emailDestino = document.getElementById('email-destino').value;
        const observacoes = document.getElementById('observacoes').value;
        const dataHora = new Date().toLocaleString('pt-BR');

        const novoReporte = {
            dataHora,
            jornada: tipoJornadaAtual,
            projeto: projetoNome,
            setor,
            responsavel,
            observacoes
        };

        // Salva Localmente
        reportesBD.unshift(novoReporte);
        localStorage.setItem('reportes_db', JSON.stringify(reportesBD));

        // Tenta enviar via EmailJS (se estiver configurado)
        const templateParams = {
            to_email: emailDestino,
            jornada: tipoJornadaAtual,
            projeto: projetoNome,
            setor: setor,
            responsavel: responsavel,
            dataHora: dataHora,
            observacoes: observacoes || 'Nenhuma'
        };

        /* 
           Descomente as linhas abaixo se tiver configurado suas chaves do EmailJS:
        
        emailjs.send('SEU_SERVICE_ID', 'SEU_TEMPLATE_ID', templateParams)
            .then(() => console.log("E-mail disparado!"))
            .catch((err) => console.log("Erro e-mail:", err));
        */

        alert(`✅ Reporte de ${tipoJornadaAtual} salvo com sucesso!`);
        document.getElementById('reporteForm').reset();
    }

    // Renderizar Histórico de Reportes
    function renderizarHistorico() {
        const tbody = document.getElementById('corpo-tabela');
        tbody.innerHTML = '';

        if (reportesBD.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Nenhum reporte salvo no histórico.</td></tr>';
            return;
        }

        reportesBD.forEach(r => {
            tbody.innerHTML += `
                <tr>
                    <td>${r.dataHora}</td>
                    <td><b>${r.jornada}</b></td>
                    <td>${r.projeto}</td>
                    <td>${r.setor}</td>
                    <td>${r.responsavel}</td>
                    <td>${r.observacoes || '-'}</td>
                </tr>`;
        });
    }

    // EXPORTAR RELATÓRIO PARA EXCEL (.CSV)
    function exportarExcel() {
        if (reportesBD.length === 0) {
            alert("Nenhum dado para exportar.");
            return;
        }

        let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
        csvContent += "Data/Hora;Tipo de Jornada;Projeto;Setor;Responsavel;Observacoes\n";

        reportesBD.forEach(r => {
            let obsLimpa = (r.observacoes || '').replace(/\n/g, ' ');
            csvContent += `"${r.dataHora}";"${r.jornada}";"${r.projeto}";"${r.setor}";"${r.responsavel}";"${obsLimpa}"\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Relatorio_Reportes_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // EXPORTAR RELATÓRIO PARA PDF
    function exportarPDF() {
        if (reportesBD.length === 0) {
            alert("Nenhum dado para exportar em PDF.");
            return;
        }
        window.print();
    }

    // Inicialização ao carregar a página
    renderizarSelectProjetos();
</script>

</body>
</html>
