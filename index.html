<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Diário de Atividades (RDO)</title>
    <!-- Biblioteca externa para conversão HTML -> PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #0056b3;
            --success: #28a745;
            --pdf-color: #dc3545;
            --danger: #dc3545;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 15px;
            color: #333;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9em;
            color: #666;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 0.95em;
        }

        textarea {
            resize: vertical;
            height: 70px;
        }

        .empreiteira-box {
            border: 2px dashed #0056b3;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #f8f9fa;
            position: relative;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn-success { background: var(--success); color: white; }
        .btn-pdf { background: var(--pdf-color); color: white; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; font-size: 0.8em; width: auto; padding: 5px 10px; float: right; }

        /* Estilo para modelo de impressão PDF */
        #pdf-template {
            display: none;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: #333;
        }
        #pdf-template h1 { color: #0056b3; font-size: 20pt; border-bottom: 2px solid #0056b3; padding-bottom: 5px; }
        #pdf-template h3 { color: #333; font-size: 14pt; margin-top: 15px; margin-bottom: 5px; border-bottom: 1px solid #ddd; }
        #pdf-template .meta-info { margin-bottom: 15px; font-size: 11pt; line-height: 1.6; }
        #pdf-template .emp-card-pdf { background: #f9f9f9; border: 1px solid #ccc; border-radius: 5px; padding: 12px; margin-bottom: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📋 REPORTE DIÁRIO DE ATIVIDADES</h2>
    <div class="subtitle">Gerador de RDO e Exportador .TXT / .PDF</div>

    <form id="rdoForm">
        <!-- INFORMACÕES DA OBRA -->
        <div class="card">
            <h3>📍 Dados Gerais da Obra</h3>
            <div class="form-group">
                <label>Obra *</label>
                <input type="text" id="obra" placeholder="Ex: Marca Ambiental" required>
            </div>
            <div class="form-group">
                <label>OS/N° do projeto *</label>
                <input type="text" id="os" placeholder="Ex: 4024958" required>
            </div>
            <div class="form-group">
                <label>Data *</label>
                <input type="date" id="data" required>
            </div>

            <!-- PREVISÃO DO TEMPO / CONDIÇÃO CLIMÁTICA -->
            <h4 style="margin-top: 15px; margin-bottom: 10px;">☀️ Previsão do Tempo / Condições Climáticas</h4>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Manhã</label>
                    <select id="clima-manha">
                        <option value="Bom / Claro">Bom / Claro</option>
                        <option value="Nublado">Nublado</option>
                        <option value="Chuva Leve">Chuva Leve</option>
                        <option value="Chuva Forte">Chuva Forte / Impraticável</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Tarde</label>
                    <select id="clima-tarde">
                        <option value="Bom / Claro">Bom / Claro</option>
                        <option value="Nublado">Nublado</option>
                        <option value="Chuva Leve">Chuva Leve</option>
                        <option value="Chuva Forte">Chuva Forte / Impraticável</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Noite</label>
                    <select id="clima-noite">
                        <option value="Bom / Claro">Bom / Claro</option>
                        <option value="Nublado">Nublado</option>
                        <option value="Chuva Leve">Chuva Leve</option>
                        <option value="Chuva Forte">Chuva Forte / Impraticável</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- SEÇÃO DINÂMICA DE EMPREITEIRAS -->
        <div class="card">
            <h3>🏗️ Empreiteiras Envolvidas</h3>
            <div id="container-empreiteiras"></div>

            <button type="button" class="btn btn-primary" onclick="adicionarEmpreiteira()">➕ Incluir Outra Empreiteira</button>
        </div>

        <!-- BOTOES DE EXPORTAÇÃO -->
        <div class="btn-group">
            <button type="button" class="btn btn-success" onclick="gerarETbaixarTXT()">📄 Baixar Reporte em Texto (.TXT)</button>
            <button type="button" class="btn btn-pdf" onclick="gerarETbaixarPDF()">📕 Baixar Reporte em PDF (.PDF)</button>
        </div>
    </form>
</div>

<!-- TEMPLATE OCULTO PARA GERAR O PDF -->
<div id="pdf-template"></div>

<script>
    let contadorEmpreiteiras = 0;
    const listaEmpresas = ["TEXCAL", "CONCREJATO", "MN Engenharia", "Engenhar"];

    window.onload = function() {
        document.getElementById('data').valueAsDate = new Date();
        adicionarEmpreiteira();
    };

    function adicionarEmpreiteira() {
        contadorEmpreiteiras++;
        const container = document.getElementById('container-empreiteiras');

        let optionsEmpresas = listaEmpresas.map(emp => `<option value="${emp}">${emp}</option>`).join('');

        const div = document.createElement('div');
        div.className = 'empreiteira-box';
        div.id = `emp-box-${contadorEmpreiteiras}`;
        div.innerHTML = `
            ${contadorEmpreiteiras > 1 ? `<button type="button" class="btn btn-danger" onclick="removerEmpreiteira(${contadorEmpreiteiras})">❌ Remover</button>` : ''}
            <h4>Empreiteira #${contadorEmpreiteiras}</h4>
            
            <div class="form-group">
                <label>Nome da Empreiteira *</label>
                <select class="emp-nome" required>
                    <option value="">Selecione a empreiteira...</option>
                    ${optionsEmpresas}
                </select>
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Chegada</label>
                    <input type="time" class="emp-chegada">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Início Atividades</label>
                    <input type="time" class="emp-inicio">
                </div>
            </div>

            <div class="form-group">
                <label>Equipe Mobilizada (Supervisores, Oficiais, Ajudantes)</label>
                <textarea class="emp-equipe" placeholder="Ex:&#10;• Supervisor: Erivelton Cão&#10;• Oficiais Líderes: Jair, Júlio&#10;• Ajudantes: Davi, Alexsander"></textarea>
            </div>

            <div class="form-group">
                <label>Programação das Atividades</label>
                <textarea class="emp-atividades" placeholder="Ex: Iniciar instalação dos pavês e rejunte da base."></textarea>
            </div>
        `;

        container.appendChild(div);
    }

    function removerEmpreiteira(id) {
        const box = document.getElementById(`emp-box-${id}`);
        if (box) box.remove();
    }

    function validarFormulario() {
        const form = document.getElementById('rdoForm');
        if (!form.checkValidity()) {
            form.reportValidity();
            return false;
        }
        return true;
    }

    // EXPORTAÇÃO TXT
    function gerarETbaixarTXT() {
        if (!validarFormulario()) return;

        const obra = document.getElementById('obra').value;
        const os = document.getElementById('os').value;
        const dataInput = document.getElementById('data').value;
        
        const climaManha = document.getElementById('clima-manha').value;
        const climaTarde = document.getElementById('clima-tarde').value;
        const climaNoite = document.getElementById('clima-noite').value;

        const partesData = dataInput.split('-');
        const dataFormatada = `${partesData[2]}/${partesData[1]}/${partesData[0]}`;

        let txt = `REPORTE DIÁRIO DE ATIVIDADES\n`;
        txt += `Obra: ${obra}\n`;
        txt += `OS/N° do projeto: ${os}\n`;
        txt += `Data: ${dataFormatada}\n`;
        txt += `Condições Climáticas: Manhã: ${climaManha} | Tarde: ${climaTarde} | Noite: ${climaNoite}\n`;
        txt += `==================================================\n\n`;

        const caixasEmpreiteiras = document.querySelectorAll('.empreiteira-box');

        caixasEmpreiteiras.forEach((box) => {
            const nome = box.querySelector('.emp-nome').value;
            const chegada = box.querySelector('.emp-chegada').value || 'Não informado';
            const inicio = box.querySelector('.emp-inicio').value || 'Não informado';
            const equipe = box.querySelector('.emp-equipe').value;
            const atividades = box.querySelector('.emp-atividades').value;

            txt += `${nome}\n`;
            txt += `Horários:\n`;
            txt += `• Chegada: ${chegada}\n`;
            txt += `• Início das atividades: ${inicio}\n\n`;

            txt += `Equipe Mobilizada:\n${equipe ? equipe : 'Não informada'}\n\n`;
            txt += `Programação das Atividades:\n${atividades ? atividades : 'Não informada'}\n`;
            txt += `--------------------------------------------------\n\n`;
        });

        const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `Reporte_${obra.replace(/\s+/g, '_')}_${dataInput}.txt`;
        link.click();
    }

    // EXPORTAÇÃO PDF
    function gerarETbaixarPDF() {
        if (!validarFormulario()) return;

        const obra = document.getElementById('obra').value;
        const os = document.getElementById('os').value;
        const dataInput = document.getElementById('data').value;
        
        const climaManha = document.getElementById('clima-manha').value;
        const climaTarde = document.getElementById('clima-tarde').value;
        const climaNoite = document.getElementById('clima-noite').value;

        const partesData = dataInput.split('-');
        const dataFormatada = `${partesData[2]}/${partesData[1]}/${partesData[0]}`;

        const pdfArea = document.getElementById('pdf-template');
        
        let htmlContent = `
            <h1>REPORTE DIÁRIO DE ATIVIDADES (RDO)</h1>
            <div class="meta-info">
                <strong>Obra:</strong> ${obra}<br>
                <strong>OS/N° do projeto:</strong> ${os}<br>
                <strong>Data:</strong> ${dataFormatada}<br>
                <strong>Condições Climáticas:</strong> Manhã: ${climaManha} | Tarde: ${climaTarde} | Noite: ${climaNoite}
            </div>
            <h3>Empreiteiras Envolvidas</h3>
        `;

        const caixasEmpreiteiras = document.querySelectorAll('.empreiteira-box');

        caixasEmpreiteiras.forEach((box) => {
            const nome = box.querySelector('.emp-nome').value;
            const chegada = box.querySelector('.emp-chegada').value || 'Não informado';
            const inicio = box.querySelector('.emp-inicio').value || 'Não informado';
            const equipe = box.querySelector('.emp-equipe').value;
            const atividades = box.querySelector('.emp-atividades').value;

            htmlContent += `
                <div class="emp-card-pdf">
                    <h4 style="margin: 0 0 8px 0; color: #0056b3;">${nome}</h4>
                    <p style="margin: 2px 0;"><strong>Horários:</strong> Chegada: ${chegada} | Início Atividades: ${inicio}</p>
                    <p style="margin: 6px 0 2px 0;"><strong>Equipe Mobilizada:</strong></p>
                    <div style="white-space: pre-wrap; font-size: 10pt; background: #fff; padding: 6px; border: 1px solid #eee;">${equipe ? equipe : 'Não informada'}</div>
                    <p style="margin: 6px 0 2px 0;"><strong>Programação das Atividades:</strong></p>
                    <div style="white-space: pre-wrap; font-size: 10pt; background: #fff; padding: 6px; border: 1px solid #eee;">${atividades ? atividades : 'Não informada'}</div>
                </div>
            `;
        });

        pdfArea.innerHTML = htmlContent;

        const opt = {
            margin:       10,
            filename:     `Reporte_${obra.replace(/\s+/g, '_')}_${dataInput}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(pdfArea).save();
    }
</script>

</body>
</html>
